name: changeset-guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  validate-changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Collect diff
        id: diff
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          git diff --name-only "$BASE" "$HEAD" > diff.txt
          cat diff.txt

          # Fichiers modifiant des packages (exclut md, tests)
          FILTERED=$(grep '^packages/' diff.txt | \
            grep -Ev '\.(md|MD)$' | \
            grep -Ev '(__tests__|\.spec\.|\.test\.)' || true)

          echo "$FILTERED" > filtered.txt
          COUNT=$(wc -l filtered.txt | awk '{print $1}')
          echo "CHANGED_PACKAGES_FILES=$COUNT" >> $GITHUB_OUTPUT

      - name: Count changeset files
        id: changesets
        run: |
          CSET=$(git ls-files .changeset/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "CHANGESETS_COUNT=$CSET" >> $GITHUB_OUTPUT
          echo "Found $CSET changeset file(s)."

      - name: Setup pnpm (for plan check)
        uses: pnpm/action-setup@v4
        with: { run_install: false }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (only if we need deeper validation)
        if: steps.diff.outputs.CHANGED_PACKAGES_FILES != '0'
        run: pnpm install --frozen-lockfile

      - name: Changeset plan (only if needed)
        if: steps.diff.outputs.CHANGED_PACKAGES_FILES != '0'
        id: plan
        run: |
          pnpm changeset status --output=JSON > plan.json || echo '{"releases":[]}' > plan.json
          COUNT=$(jq '.releases | length' plan.json)
          echo "PLAN_RELEASES=$COUNT" >> $GITHUB_OUTPUT
          echo "Plan releases: $COUNT"

      - name: Validate
        run: |
          CHANGED=${{ steps.diff.outputs.CHANGED_PACKAGES_FILES }}
          CSET=${{ steps.changesets.outputs.CHANGESETS_COUNT }}
          PLAN=${{ steps.plan.outputs.PLAN_RELEASES || '0' }}

          if [ "$CHANGED" -gt 0 ] && [ "$CSET" -eq 0 ]; then
            echo "❌ Des packages modifiés mais aucun fichier .changeset/*.md."
            exit 1
          fi

          if [ "$CHANGED" -gt 0 ] && [ "$PLAN" -eq 0 ]; then
            echo "⚠️ Packages modifiés mais le plan Changesets ne contient pas de releases."
            echo "   Vérifie que le changeset cible les bons packages."
            exit 1
          fi

          echo "✅ Validation OK."